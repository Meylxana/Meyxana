name: 24/7 YouTube Shorts Bot

on:
  schedule:
    - cron: '0 */6 * * *'  # Hər 6 saatdan bir avtomatik işə düşəcək
  workflow_dispatch:      # İstədiyin vaxt əllə işə salmaq üçün

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Repository-ni yüklə
        uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kitabxanaları quraşdır
        run: |
          pip install --upgrade pip
          pip install gTTS moviepy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Skripti icra et
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"
